<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VemosUI 文档</title>
  <script src="./vemosui.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow: hidden; /* 防止双滚动条 */
      background-color: var(--vemos-bg-default, #fff);
      color: var(--vemos-text-default, #333);
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    /* 暗黑模式下 body 的样式 */
    [data-theme="dark"] body {
      background-color: var(--vemos-bg-default, #2d3748);
      color: var(--vemos-text-default, #e2e8f0);
    }
    
    .layout-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    
    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 60px); /* 考虑导航栏高度 */
    }
    
    /* 侧边栏样式 */
    v-sidebar {
      flex-shrink: 0;
      height: 100%;
    }
    
    /* 内容面板样式 */
    v-content-panel {
      flex: 1;
      overflow: hidden;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="layout-container">
    <!-- 导航栏 -->
    <v-navbar title="VemosUI 文档" theme="primary">
      <v-button slot="left" type="default" size="small">菜单</v-button>
      <v-button slot="right" type="default" size="small">登录</v-button>
    </v-navbar>
    
    <div class="main-content">
      <!-- 侧边栏 -->
      <v-sidebar 
        id="sidebar"
        width="260px" 
        collapsed="false"
        toggleable="true"
        items='[{"text": "介绍", "icon": "fa fa-home", "route": "docs/introduction.html"}, {"text": "基础组件", "icon": "fa fa-cube", "expanded": true, "children": [{"text": "按钮 (v-button)", "icon": "fa fa-square", "route": "docs/button.html"}, {"text": "卡片 (v-card)", "icon": "fa fa-id-card", "route": "docs/card.html"}, {"text": "表格 (v-table)", "icon": "fa fa-table", "route": "docs/table.html"}, {"text": "代码展示 (v-code-display)", "icon": "fa fa-code", "route": "docs/code-display.html"}, {"text": "输入框 (v-input)", "icon": "fa fa-i-cursor", "route": "docs/input.html"}, {"text": "开关 (v-switch)", "icon": "fa fa-toggle-on", "route": "docs/switch.html"}, {"text": "警告框 (v-alert)", "icon": "fa fa-exclamation-triangle", "route": "docs/alert.html"}, {"text": "栅格 (v-row)", "icon": "fa fa-th", "route": "docs/grid.html"}, {"text": "新栅格 (v-grid)", "icon": "fa fa-th-large", "route": "docs/grid-new.html"}, {"text": "图标 (Icons)", "icon": "fa fa-star", "route": "docs/icons.html"}]}, {"text": "导航组件", "icon": "fa fa-compass", "children": [{"text": "导航栏 (v-navbar)", "icon": "fa fa-bars", "route": "docs/navbar.html"}, {"text": "侧边栏 (v-sidebar)", "icon": "fa fa-list", "route": "docs/sidebar.html"}]}, {"text": "主题系统", "icon": "fa fa-palette", "route": "docs/theme.html"}, {"text": "动画效果", "icon": "fa fa-sparkles", "route": "docs/animations.html"}]'>
        <div slot="header">
          <h3 style="margin: 0; padding: 1.5px; text-align: center;">VemosUI</h3>
        </div>
        <div slot="footer" style="width: 100%;">
    </div>
      </v-sidebar>
      
      <!-- 内容面板 -->
      <v-content-panel id="content-panel" src="docs/introduction.html">
        <div slot="header">
          <h2 id="page-title">介绍</h2>
        </div>
        <div slot="footer">
          VemosUI - 轻量级前端UI框架
        </div>
      </v-content-panel>
    </div>
  </div>

  <script>
    // 页面加载完成后执行
    document.addEventListener('DOMContentLoaded', function() {
      const sidebar = document.getElementById('sidebar');
      const contentPanel = document.getElementById('content-panel');
      const pageTitle = document.getElementById('page-title');
      
      // 监听侧边栏菜单项点击事件
      sidebar.addEventListener('v-sidebar-item-click', function(e) {
        const items = JSON.parse(sidebar.getAttribute('items'));
        const item = items[e.detail.index];
        
        if (item.route) {
          contentPanel.setAttribute('src', item.route);
          pageTitle.textContent = item.text;
        }
      });
      
      // 监特侧边栏子菜单项点击事件
      sidebar.addEventListener('v-sidebar-subitem-click', function(e) {
        const items = JSON.parse(sidebar.getAttribute('items'));
        const parentItem = items[e.detail.parentIndex];
        const subItem = parentItem.children[e.detail.index];
        
        if (subItem.route) {
          contentPanel.setAttribute('src', subItem.route);
          pageTitle.textContent = subItem.text;
        }
      });
    });
  </script>
</body>
</html>
