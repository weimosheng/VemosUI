<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VemosUI 文档</title>
  <script src="./VemosUI.js"></script>
  <!-- 加载组件 -->
  <script src="./components/button.js"></script>
  <script src="./components/card.js"></script>
  <script src="./components/table.js"></script>
  <script src="./components/code-display.js"></script>
  <script src="./components/navbar.js"></script>
  <script src="./components/sidebar.js"></script>
  <script src="./components/content-panel.js"></script>
  <script src="./components/input.js"></script>
  <script src="./components/switch.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow: hidden; /* 防止双滚动条 */
    }
    
    .layout-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    
    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 60px); /* 考虑导航栏高度 */
    }
    
    /* 侧边栏样式 */
    v-sidebar {
      flex-shrink: 0;
      height: 100%;
    }
    
    /* 内容面板样式 */
    v-content-panel {
      flex: 1;
      overflow: hidden;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="layout-container">
    <!-- 导航栏 -->
    <v-navbar title="VemosUI 文档" theme="primary">
      <v-button slot="left" type="default" size="small">菜单</v-button>
      <v-button slot="right" type="default" size="small">登录</v-button>
    </v-navbar>
    
    <div class="main-content">
      <!-- 侧边栏 -->
      <v-sidebar 
        id="sidebar"
        width="260px"
        items='[{"text": "介绍", "icon": "🏠", "route": "docs/introduction.html"}, {"text": "基础组件", "icon": "⚙️", "expanded": true, "children": [{"text": "按钮 (v-button)", "icon": "🔘", "route": "docs/button.html"}, {"text": "卡片 (v-card)", "icon": "🃏", "route": "docs/card.html"}, {"text": "表格 (v-table)", "icon": "📊", "route": "docs/table.html"}, {"text": "代码展示 (v-code-display)", "icon": "💻", "route": "docs/code-display.html"}, {"text": "输入框 (v-input)", "icon": "✍️", "route": "docs/input.html"}, {"text": "开关 (v-switch)", "icon": "🔛", "route": "docs/switch.html"}, {"text": "图标 (Icons)", "icon": "⭐", "route": "docs/icons.html"}]}, {"text": "导航组件", "icon": "🧭", "children": [{"text": "导航栏 (v-navbar)", "icon": "🔽", "route": "docs/navbar.html"}, {"text": "侧边栏 (v-sidebar)", "icon": "📋", "route": "docs/sidebar.html"}]}, {"text": "动画效果", "icon": "✨", "route": "docs/animations.html"}]'>
        <div slot="header">
          <h3 style="margin: 0; padding: 10px 0; text-align: center;">VemosUI</h3>
        </div>
        <div slot="footer">
          &copy; 2026 VemosUI
        </div>
      </v-sidebar>
      
      <!-- 内容面板 -->
      <v-content-panel id="content-panel" src="docs/introduction.html">
        <div slot="header">
          <h2 id="page-title">介绍</h2>
        </div>
        <div slot="footer">
          VemosUI - 轻量级前端UI框架
        </div>
      </v-content-panel>
    </div>
  </div>

  <script>
    // 页面加载完成后执行
    document.addEventListener('DOMContentLoaded', function() {
      const sidebar = document.getElementById('sidebar');
      const contentPanel = document.getElementById('content-panel');
      const pageTitle = document.getElementById('page-title');
      
      // 监听侧边栏菜单项点击事件
      sidebar.addEventListener('v-sidebar-item-click', function(e) {
        const items = JSON.parse(sidebar.getAttribute('items'));
        const item = items[e.detail.index];
        
        if (item.route) {
          contentPanel.setAttribute('src', item.route);
          pageTitle.textContent = item.text;
        }
      });
      
      // 监特侧边栏子菜单项点击事件
      sidebar.addEventListener('v-sidebar-subitem-click', function(e) {
        const items = JSON.parse(sidebar.getAttribute('items'));
        const parentItem = items[e.detail.parentIndex];
        const subItem = parentItem.children[e.detail.index];
        
        if (subItem.route) {
          contentPanel.setAttribute('src', subItem.route);
          pageTitle.textContent = subItem.text;
        }
      });
    });
  </script>
</body>
</html>
