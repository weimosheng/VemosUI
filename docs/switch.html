<h1>开关 (v-switch)</h1>

<p>v-switch 是一个开关组件，用于在两种状态之间切换。</p>

<h2>基本用法</h2>
<div class="demo">
  <v-card title="基本开关">
    <v-switch></v-switch>
  </v-card>
</div>

<h2>默认选中状态</h2>
<div class="demo">
  <v-card title="默认选中">
    <v-switch checked="true"></v-switch>
  </v-card>
</div>

<h2>禁用状态</h2>
<div class="demo">
  <v-card title="禁用的开关">
    <v-switch checked="true" disabled="true"></v-switch>
    <v-switch disabled="true"></v-switch>
  </v-card>
</div>

<h2>自定义值</h2>
<div class="demo">
  <v-card title="自定义激活和非激活值">
    <div style="margin-bottom: 10px;">
      <label>激活值为"on"，非激活值为"off"：</label>
      <v-switch active-value="on" inactive-value="off"></v-switch>
    </div>
  </v-card>
</div>
