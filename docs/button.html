<h1>按钮 (v-button)</h1>

<p>v-button 是一个按钮组件，用于触发相应的操作。</p>

<h2>演示</h2>

<v-row gutter="10">
  <v-col span="24" xl="12">
    <v-card title="按钮类型" subtitle="使用 type 属性来定义按钮的样式，可选值包括 default/primary/success/warning/error/text">
      <v-button type="default">默认按钮</v-button>
      <v-button type="primary">主要按钮</v-button>
      <v-button type="success">成功按钮</v-button>
      <v-button type="warning">警告按钮</v-button>
      <v-button type="error">危险按钮</v-button>
      <v-button type="text">文本按钮</v-button>
    </v-card>
    <v-code-display 
      lang="html"
      show-line-numbers="true"
      copyable="true"
      code="<v-button type=&quot;default&quot;>默认按钮</v-button>
<v-button type=&quot;primary&quot;>主要按钮</v-button>
<v-button type=&quot;success&quot;>成功按钮</v-button>
<v-button type=&quot;warning&quot;>警告按钮</v-button>
<v-button type=&quot;error&quot;>危险按钮</v-button>
<v-button type=&quot;text&quot;>文本按钮</v-button>"
    ></v-code-display>
  </v-col>
  <v-col span="24" xl="12">
    <v-card title="按钮尺寸" subtitle="使用 size 属性来定义按钮的尺寸，可选值包括 small/medium/large">
      <v-button size="small">小按钮</v-button>
      <v-button size="medium">中按钮</v-button>
      <v-button size="large">大按钮</v-button>
    </v-card>
    <v-code-display 
      lang="html"
      show-line-numbers="true"
      copyable="true"
      code="<v-button size=&quot;small&quot;>小按钮</v-button>
<v-button size=&quot;medium&quot;>中按钮</v-button>
<v-button size=&quot;large&quot;>大按钮</v-button>"
    ></v-code-display>
  </v-col>
  <v-col span="12">
    <v-card title="虚线按钮" subtitle="使用 dashed 属性来使用虚线按钮"> 
      <v-button type="default" dashed>虚线按钮</v-button>
      <v-button type="primary" dashed>虚线按钮</v-button>
      <v-button type="success" dashed>虚线按钮</v-button>
      <v-button type="warning" dashed>虚线按钮</v-button>
      <v-button type="error" dashed>虚线按钮</v-button>
    </v-card>
    <v-code-display 
      lang="html"
      show-line-numbers="true"
      copyable="true"
      code="<v-button type=&quot;default&quot; dashed>虚线按钮</v-button>
<v-button type=&quot;primary&quot; dashed>虚线按钮</v-button>
<v-button type=&quot;success&quot; dashed>虚线按钮</v-button>
<v-button type=&quot;warning&quot; dashed>虚线按钮</v-button>
<v-button type=&quot;error&quot; dashed>虚线按钮</v-button>"
    ></v-code-display>
  </v-col>
  <v-col span="12">
    <v-card title="图标按钮" subtitle="使用 icon 属性来添加图标，支持 Font Awesome 图标。"> 
      <v-button icon="fas fa-home">首页</v-button>
      <v-button icon="fas fa-user" type="primary">用户</v-button>
      <v-button icon="fas fa-cog" type="success">设置</v-button>
      <v-button icon="fas fa-check" type="warning">确认</v-button>
      <v-button icon="fas fa-trash" type="error">删除</v-button>
    </v-card>
    <v-code-display 
      lang="html"
      show-line-numbers="true"
      copyable="true"
      code="<v-button icon=&quot;fas fa-home&quot;>首页</v-button>
<v-button icon=&quot;fas fa-user&quot; type=&quot;primary&quot;>用户</v-button>
<v-button icon=&quot;fas fa-cog&quot; type=&quot;success&quot;>设置</v-button>
<v-button icon=&quot;fas fa-check&quot; type=&quot;warning&quot;>确认</v-button>
<v-button icon=&quot;fas fa-trash&quot; type=&quot;error&quot;>删除</v-button>"
    ></v-code-display>
  </v-col>
  <v-col span="12">
    <v-card title="圆形按钮" subtitle="使用 circle 属性来创建圆形按钮，通常与 icon 属性一起使用。">
      <v-button icon="fas fa-home" circle></v-button>
      <v-button icon="fas fa-user" circle type="primary"></v-button>
      <v-button icon="fas fa-cog" circle type="success"></v-button>
      <v-button icon="fas fa-check" circle type="warning"></v-button>
      <v-button icon="fas fa-trash" circle type="error"></v-button>
    </v-card>
    <v-code-display 
      lang="html"
      show-line-numbers="true"
      copyable="true"
      code="<v-button icon=&quot;fas fa-home&quot; circle></v-button>
<v-button icon=&quot;fas fa-user&quot; circle type=&quot;primary&quot;></v-button>
<v-button icon=&quot;fas fa-cog&quot; circle type=&quot;success&quot;></v-button>
<v-button icon=&quot;fas fa-check&quot; circle type=&quot;warning&quot;></v-button>
<v-button icon=&quot;fas fa-trash&quot; circle type=&quot;error&quot;></v-button>"
    ></v-code-display>
  </v-col>
</v-row>

<h2>禁用状态</h2>
<p><small>使用 disabled 属性来禁用按钮，使其不可点击。</small></p>

<v-row gutter="20">
  <v-col span="12">
    <v-card title="禁用按钮">
      <v-button type="primary" disabled>禁用按钮</v-button>
    </v-card>
    <v-code-display 
      lang="html"
      show-line-numbers="true"
      copyable="true"
      code="<v-button type=&quot;primary&quot; disabled>禁用按钮</v-button>"
    ></v-code-display>
  </v-col>
</v-row>

<h2>自定义颜色</h2>
<p><small>使用 color 和 background 属性来自定义按钮的颜色。</small></p>

<v-row gutter="20">
  <v-col span="12">
    <v-card title="自定义按钮颜色">
      <v-button color="#ff6b6b" background="#ffe0e0">自定义颜色按钮</v-button>
      <v-button color="#546e7a" background="#f5f5f5">灰色系按钮</v-button>
      <v-button type="primary" dashed color="#8e44ad">虚线+自定义颜色</v-button>
    </v-card>
    <v-code-display 
      lang="html"
      show-line-numbers="true"
      copyable="true"
      code="<v-button color=&quot;#ff6b6b&quot; background=&quot;#ffe0e0&quot;>自定义颜色按钮</v-button>
<v-button color=&quot;#546e7a&quot; background=&quot;#f5f5f5&quot;>灰色系按钮</v-button>
<v-button type=&quot;primary&quot; dashed color=&quot;#8e44ad&quot;>虚线+自定义颜色</v-button>"
    ></v-code-display>
  </v-col>
</v-row>
