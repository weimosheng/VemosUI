<h1>表格 (v-table)</h1>

<p>v-table 是一个功能强大的表格组件，用于展示结构化的数据。</p>

<h2>基本用法</h2>
<div class="demo">
  <v-card title="基本表格">
    <v-table 
      data='[{"id": 1, "name": "张三", "age": 28, "address": "北京市朝阳区"}, {"id": 2, "name": "李四", "age": 24, "address": "上海市浦东新区"}]'
      columns='[{"prop": "id", "title": "ID"}, {"prop": "name", "title": "姓名"}, {"prop": "age", "title": "年龄"}, {"prop": "address", "title": "地址"}]'
    ></v-table>
  </v-card>
</div>

<h2>带边框的表格</h2>
<div class="demo">
  <v-card title="带边框表格">
    <v-table 
      border="true"
      data='[{"id": 1, "name": "张三", "age": 28, "address": "北京市朝阳区"}, {"id": 2, "name": "李四", "age": 24, "address": "上海市浦东新区"}, {"id": 3, "name": "王五", "age": 32, "address": "广州市天河区"}]'
      columns='[{"prop": "id", "title": "ID"}, {"prop": "name", "title": "姓名"}, {"prop": "age", "title": "年龄"}, {"prop": "address", "title": "地址"}]'
    ></v-table>
  </v-card>
</div>

<h2>斑马纹表格</h2>
<div class="demo">
  <v-card title="斑马纹表格">
    <v-table 
      stripe="true"
      border="true"
      data='[{"id": 1, "name": "张三", "age": 28, "address": "北京市朝阳区"}, {"id": 2, "name": "李四", "age": 24, "address": "上海市浦东新区"}, {"id": 3, "name": "王五", "age": 32, "address": "广州市天河区"}, {"id": 4, "name": "赵六", "age": 29, "address": "深圳市南山区"}]'
      columns='[{"prop": "id", "title": "ID"}, {"prop": "name", "title": "姓名"}, {"prop": "age", "title": "年龄"}, {"prop": "address", "title": "地址"}]'
    ></v-table>
  </v-card>
</div>

<h2>不同尺寸</h2>
<div class="demo">
  <v-card title="不同尺寸的表格">
    <h3>小号表格</h3>
    <v-table 
      size="small"
      stripe="true"
      data='[{"id": 1, "name": "张三", "age": 28}, {"id": 2, "name": "李四", "age": 24}]'
      columns='[{"prop": "id", "title": "ID"}, {"prop": "name", "title": "姓名"}, {"prop": "age", "title": "年龄"}]'
    ></v-table>
    
    <h3>大号表格</h3>
    <v-table 
      size="large"
      stripe="true"
      data='[{"id": 1, "name": "张三", "age": 28}, {"id": 2, "name": "李四", "age": 24}]'
      columns='[{"prop": "id", "title": "ID"}, {"prop": "name", "title": "姓名"}, {"prop": "age", "title": "年龄"}]'
    ></v-table>
  </v-card>
</div>

<h2>多颜色主题</h2>
<div class="demo">
  <v-card title="不同主题的表格">
    <h3>主要主题</h3>
    <v-table 
      theme="primary"
      border="true"
      stripe="true"
      data='[{"id": 1, "name": "张三", "age": 28}, {"id": 2, "name": "李四", "age": 24}]'
      columns='[{"prop": "id", "title": "ID"}, {"prop": "name", "title": "姓名"}, {"prop": "age", "title": "年龄"}]'
    ></v-table>
    
    <h3>成功主题</h3>
    <v-table 
      theme="success"
      border="true"
      stripe="true"
      data='[{"id": 1, "name": "张三", "age": 28}, {"id": 2, "name": "李四", "age": 24}]'
      columns='[{"prop": "id", "title": "ID"}, {"prop": "name", "title": "姓名"}, {"prop": "age", "title": "年龄"}]'
    ></v-table>
    
    <h3>警告主题</h3>
    <v-table 
      theme="warning"
      border="true"
      stripe="true"
      data='[{"id": 1, "name": "张三", "age": 28}, {"id": 2, "name": "李四", "age": 24}]'
      columns='[{"prop": "id", "title": "ID"}, {"prop": "name", "title": "姓名"}, {"prop": "age", "title": "年龄"}]'
    ></v-table>
    
    <h3>危险主题</h3>
    <v-table 
      theme="danger"
      border="true"
      stripe="true"
      data='[{"id": 1, "name": "张三", "age": 28}, {"id": 2, "name": "李四", "age": 24}]'
      columns='[{"prop": "id", "title": "ID"}, {"prop": "name", "title": "姓名"}, {"prop": "age", "title": "年龄"}]'
    ></v-table>
  </v-card>
</div>

<h2>属性</h2>
<v-table 
  border="true"
  stripe="true"
  data='[
    {"param": "data", "description": "表格数据", "type": "Array", "values": "-", "default": "[]"},
    {"param": "columns", "description": "表格列配置", "type": "Array", "values": "-", "default": "[]"},
    {"param": "border", "description": "是否带有边框", "type": "Boolean", "values": "true/false", "default": "false"},
    {"param": "stripe", "description": "是否为斑马纹表格", "type": "Boolean", "values": "true/false", "default": "false"},
    {"param": "size", "description": "表格尺寸", "type": "String", "values": "small/medium/large", "default": "medium"},
    {"param": "theme", "description": "表格主题", "type": "String", "values": "default/primary/success/warning/danger/info", "default": "default"}
  ]'
  columns='[
    {"prop": "param", "title": "参数", "width": "150px"},
    {"prop": "description", "title": "说明", "width": "250px"},
    {"prop": "type", "title": "类型", "width": "150px"},
    {"prop": "values", "title": "可选值", "width": "200px"},
    {"prop": "default", "title": "默认值", "width": "150px"}
  ]'
></v-table>

<h2>列配置属性</h2>
<v-table 
  border="true"
  stripe="true"
  data='[
    {"param": "prop", "description": "对应列内容的字段名", "type": "String", "values": "-", "default": "-"},
    {"param": "title", "description": "对应列的标题", "type": "String", "values": "-", "default": "-"},
    {"param": "width", "description": "对应列的宽度", "type": "String", "values": "-", "default": "auto"},
    {"param": "formatter", "description": "用来格式化显示内容的函数", "type": "Function", "values": "-", "default": "-"}
  ]'
  columns='[
    {"prop": "param", "title": "参数", "width": "150px"},
    {"prop": "description", "title": "说明", "width": "250px"},
    {"prop": "type", "title": "类型", "width": "150px"},
    {"prop": "values", "title": "可选值", "width": "150px"},
    {"prop": "default", "title": "默认值", "width": "150px"}
  ]'
></v-table>
